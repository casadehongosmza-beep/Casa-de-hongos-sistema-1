<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casa de Hongos — Administración (versión corregida)</title>
<style>
:root{--bg:#faf6f0;--c:#fff;--t:#2b2118;--m:#7a6a5a;--a:#7b4f2a;--b:#e6dccf;--ok:#2e7d32;--no:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1713;--c:#2a231d;--t:#f3ebe0;--m:#b5a592;--a:#d9a066;--b:#3d342b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:10px 10px 70px}
h1{font-size:18px;margin:4px 0 8px}h2{font-size:15px;margin:14px 0 6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px}.k small{color:var(--m);display:block}.k b{font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}nav{overflow-x:auto}nav button{flex:1;min-width:62px;border:0;background:none;color:var(--m);padding:10px 2px;font-size:12px}nav .on{color:var(--a);font-weight:700}
input,select{width:100%;padding:9px;margin:3px 0 8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font-size:15px}
label{font-size:12px;color:var(--m)}.btn{background:var(--a);color:#fff;border:0;border-radius:8px;padding:11px;width:100%;font-size:15px;margin:4px 0}.btn.s{background:var(--c);color:var(--a);border:1px solid var(--a)}
.r{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px;margin:6px 0}.al{color:var(--no)}.ok{color:var(--ok)}.tb{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tabs button{flex:1;padding:8px 4px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;font-size:13px}.tabs .on{background:var(--a);color:#fff}
#toast{position:fixed;left:10px;right:10px;bottom:72px;background:var(--a);color:#fff;padding:10px;border-radius:8px;display:none;z-index:9;font-size:14px;text-align:center}</style></head><body>
<h1>🍄 Casa de Hongos — Panel <small style="font-weight:400;color:var(--m)">versión corregida</small></h1>
<section id="cloudGate" style="max-width:520px;margin:28px auto;padding:18px;background:var(--c);border:1px solid var(--b);border-radius:12px">
 <h2>Acceso al panel</h2><p id="cloudMsg">Configurá Supabase para guardar los datos de forma segura y acceder desde tus dispositivos.</p>
 <div id="cloudSetup"><label>URL del proyecto Supabase</label><input id="sbUrl" type="url" placeholder="https://xxxx.supabase.co"><label>Clave pública (anon / publishable)</label><input id="sbKey" autocomplete="off" placeholder="sb_publishable_… o anon key"><button class="btn" onclick="saveCloudConfig()">Conectar proyecto</button><small>La clave pública está diseñada para usarse en la web. Nunca pegues acá la service_role ni una contraseña.</small></div>
 <div id="cloudLogin" style="display:none"><label>Email</label><input id="authEmail" type="email" autocomplete="username"><label>Contraseña</label><input id="authPassword" type="password" autocomplete="current-password"><button class="btn" onclick="cloudSignIn()">Iniciar sesión</button><button class="btn s" onclick="cloudSignUp()">Crear cuenta</button><button class="btn s" onclick="changeCloudConfig()">Cambiar proyecto</button></div>
 <div id="cloudUser" style="display:none"><p>Sesión iniciada: <b id="cloudEmail"></b></p><button class="btn s" onclick="cloudSignOut()">Cerrar sesión</button></div>
</section>
<div id="app" style="display:none"></div>
<div id="toast"></div><nav id="nav" style="display:none"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const K='cdh2',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const CK='cdh_supabase_config';let sb=null,cloudUser=null,cloudTimer=null,cloudLoading=false;
function cloudMessage(t){$('#cloudMsg').textContent=t}
function cloudVisible(on){$('#cloudGate').style.display=on?'block':'none';$('#app').style.display=on?'none':'block';$('#nav').style.display=on?'none':'flex'}
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CK)||'{}')}catch{return {}}}
function saveCloudConfig(){const url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();if(!/^https:\/\/.+\.supabase\.co$/.test(url)||!key)return cloudMessage('Revisá la URL y la clave pública del proyecto.');localStorage.setItem(CK,JSON.stringify({url,key}));initCloud()}
function changeCloudConfig(){if(!confirm('Cambiar la conexión de Supabase en este navegador?'))return;localStorage.removeItem(CK);sb=null;cloudUser=null;$('#cloudLogin').style.display='none';$('#cloudSetup').style.display='block';cloudVisible(true);cloudMessage('Ingresá los datos del proyecto Supabase.')}
async function initCloud(){const c=cloudConfig();if(!c.url||!c.key||!window.supabase){if(!window.supabase)cloudMessage('No se pudo cargar el conector de Supabase. Revisá tu conexión a internet.');else cloudMessage('Ingresá la URL y la clave pública de Supabase.');$('#sbUrl').value=c.url||'';$('#sbKey').value=c.key||'';$('#cloudSetup').style.display='block';$('#cloudLogin').style.display='none';cloudVisible(true);return}
 try{sb=window.supabase.createClient(c.url,c.key);const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await loadCloudUser(data.session.user);else{cloudUser=null;cloudMessage('Iniciá sesión o creá una cuenta para abrir el panel.');$('#cloudSetup').style.display='none';$('#cloudLogin').style.display='block';$('#cloudUser').style.display='none';cloudVisible(true)}sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user)loadCloudUser(session.user);else if(event==='SIGNED_OUT'){cloudUser=null;cloudVisible(true);$('#cloudLogin').style.display='block';$('#cloudUser').style.display='none';cloudMessage('Sesión cerrada.')}})}catch(e){cloudMessage('No se pudo conectar: '+(e.message||e));cloudVisible(true)}}
async function loadCloudUser(user){if(!sb||cloudLoading)return;cloudLoading=true;try{const {data,error}=await sb.from('app_state').select('state').eq('user_id',user.id).maybeSingle();if(error)throw error;cloudUser=user;$('#cloudEmail').textContent=user.email||'Cuenta';$('#cloudSetup').style.display='none';$('#cloudLogin').style.display='none';$('#cloudUser').style.display='block';if(data?.state)D=data.state;else await cloudSaveNow();save();cloudVisible(false);render();cloudMessage('Datos sincronizados con Supabase.')}catch(e){cloudUser=null;cloudVisible(true);cloudMessage('No se pudo leer la tabla app_state. Ejecutá primero el SQL incluido en supabase/schema.sql. Detalle: '+(e.message||e))}finally{cloudLoading=false}}
async function cloudSignIn(){if(!sb)return;const {error}=await sb.auth.signInWithPassword({email:$('#authEmail').value.trim(),password:$('#authPassword').value});if(error)cloudMessage(error.message)}
async function cloudSignUp(){if(!sb)return;const {data,error}=await sb.auth.signUp({email:$('#authEmail').value.trim(),password:$('#authPassword').value});if(error)cloudMessage(error.message);else if(!data.session)cloudMessage('Cuenta creada. Revisá tu email para confirmar la cuenta y después iniciá sesión.')}
async function cloudSignOut(){if(sb)await sb.auth.signOut()}
async function cloudSaveNow(){if(!sb||!cloudUser)return;const {error}=await sb.from('app_state').upsert({user_id:cloudUser.id,state:D,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error}
const INS=[{n:"Zanahoria 700 g",p:0},{n:"Cebolla 1 kg",p:0},{n:"Ajo (6)",p:0},{n:"Huevos (5)",p:0},{n:"Pimienta 75 g",p:0},{n:"Pimentón 22 g",p:0},{n:"Sal 10 g",p:0},{n:"Mostaza 200 g",p:0},{n:"Aceite de oliva 125 ml",p:0},{n:"Mezcla 150 g",p:0},{n:"Rebozador sin gluten 800 g",p:0},{n:"Descartables",p:0}];
const G='Gírgolas',GE='General',FIJ=[["Totora (144 atados)",G,0],["Afrechillo (12 kg)",G,0],["Yeso (2,64 kg)",G,0],["Semilla (54 kg)",G,0],["Bolsas 50x70 (120 un)",G,0],["Alcohol (16 L)",G,0],["Bello 200 g",G,0],["Cloro (2,1 L)",G,0],["Elásticos (120 un)",G,0],["Etiquetas de precio (120 un)",G,0],["Gas (4 garrafas)",G,0],["Mano de obra siembra",G,0],["Mano de obra general",GE,0],["Agua",GE,0],["Luz",GE,0],["Internet",GE,0],["Seguro auto",GE,0],["Impuesto auto",GE,0],["Combustible",GE,0]].map(x=>({n:x[0],u:x[1],m:x[2]}));
const def={zonas:{"Guaymallén":0,"Maipú":0,"Capital":0,"Godoy Cruz":0,"Luján":0},gratis:5,
prods:[{n:"Gírgola 250 g",u:"Gírgolas",p:0,c:0,s:0,m:5},{n:"Gírgola 500 g",u:"Gírgolas",p:0,c:0,s:0,m:5},{n:"Gírgola por kg",u:"Gírgolas",p:0,c:0,s:0,m:2},{n:"Burger x6",u:"Burger",p:0,c:0,s:0,m:5},{n:"Visita",u:"Visitas",p:0,c:0,s:0,m:0}],
fijos:FIJ,rec:{gir:0,kg:2.5,burgers:40,mo:0,margenMin:30,cred:0,cupo:10,ins:INS},movs:[]};
let D;try{D=JSON.parse(localStorage.getItem(K))||def}catch(e){D=def}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}if(sb&&cloudUser&&!cloudLoading){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSaveNow().catch(e=>toast('Error al sincronizar: '+(e.message||e))),700)}};
const $$$=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const hoy=()=>new Date().toISOString().slice(0,10),mes=()=>hoy().slice(0,7);
const P=n=>D.prods.find(p=>p.n==n)||{};D.rec.cred=D.rec.cred??0;D.rec.cupo=D.rec.cupo??10;if(!P('Visita').p)P('Visita').p=0;
const M=t=>D.movs.filter(m=>m.t==t&&m.f.startsWith(mes()));
const fijoGir=()=>D.fijos.filter(x=>x.u=='Gírgolas').reduce((a,x)=>a+x.m,0);
const kgCos=ym=>D.movs.filter(m=>m.t=='prod'&&m.p=='Gírgola por kg'&&m.f.startsWith(ym)).reduce((a,m)=>a+m.q-(m.merma||0),0);
const costoKgMes=ym=>{if(D.rec.girKg>0)return D.rec.girKg;const k=kgCos(ym);return k>0?fijoGir()/k:(D.ckg||0)};
const insBurger=()=>D.rec.ins.reduce((a,x)=>a+x.p,0)+D.rec.mo;
const burgerU=ym=>insBurger()/D.rec.burgers+(D.rec.kg/D.rec.burgers)*costoKgMes(ym);
const costoBurger=()=>burgerU(mes());
function costoDe(p,ym){if(p.combo)return p.combo.reduce((a,x)=>a+costoDe(P(x.n),ym)*x.q,0);if(p.kg)return p.kg*costoKgMes(ym);if(p.n=='Gírgola por kg')return costoKgMes(ym);if(p.n=='Burger (unidad)')return burgerU(ym);if(p.un)return p.un*burgerU(ym);return p.c||0}
D.rec={...def.rec,...D.rec};D.fijos=D.fijos||def.fijos;
D.prods.forEach(p=>{if(p.n=='Gírgola 250 g')p.kg=.25;if(p.n=='Gírgola 500 g')p.kg=.5});
if(!D.prods.some(p=>p.n=='Burger (unidad)'))D.prods.splice(D.prods.findIndex(p=>p.n=='Burger x6')+1,0,{n:'Burger (unidad)',u:'Burger',p:0,c:Math.round(costoBurger()*100)/100,s:0,m:10});
const costoCombo=p=>p.combo.reduce((a,x)=>a+(P(x.n).c||0)*x.q,0);
if(!D.prods.some(p=>p.combo))D.prods.splice(D.prods.findIndex(p=>p.n=='Visita'),0,{n:'Combo Gírgola 500 g + Burger x6',u:'Combos',p:0,c:0,s:0,m:0,combo:[{n:'Gírgola 500 g',q:1},{n:'Burger x6',q:1}]});
const cst=m=>(costoDe(P(m.prod),m.f.slice(0,7))||m.c||0)*m.q;
const desc=(p,q)=>p.kg?[[P('Gírgola por kg'),q*p.kg]]:p.un?[[P('Burger (unidad)'),q*p.un]]:[[p,q]];
function recalc(){const k=kgCos(mes());if(k>0)D.ckg=fijoGir()/k;D.prods.forEach(p=>{if(p.combo||p.kg||p.un||p.n=='Gírgola por kg'||p.n=='Burger (unidad)')p.c=costoDe(p,mes())})}
if(!D.prods.some(p=>p.n=='Gírgola 1 kg'))D.prods.splice(D.prods.findIndex(p=>p.n=='Gírgola 500 g')+1,0,{n:'Gírgola 1 kg',u:'Gírgolas',p:0,c:0,s:0,m:0,kg:1});
['Extracto doble Melena de león','Extracto doble Reishi'].forEach(n=>{if(!D.prods.some(p=>p.n==n))D.prods.splice(D.prods.findIndex(p=>p.n=='Visita'),0,{n,u:'Otros',p:0,c:0,s:0,m:2})});
if(!D.prods.some(p=>p.n=='Gírgola gondolera 250 g'))D.prods.splice(D.prods.findIndex(p=>p.n=='Gírgola 1 kg')+1,0,{n:'Gírgola gondolera 250 g',u:'Gírgolas',p:0,c:0,s:0,m:0,kg:.25});
D.caja0=D.caja0||{};D.clientes=D.clientes||[];
P('Burger x6').un=6;
if(!D.k2){D.k2=1;const x=P('Burger x6');if(x.s>0)P('Burger (unidad)').s+=x.s*6;x.s=0;x.m=0}
if(!D.k1){D.k1=1;D.prods.filter(p=>p.kg).forEach(p=>{if(p.s>0)P('Gírgola por kg').s+=p.s*p.kg;p.s=0;p.m=0})}
recalc();
if(D.v!=2){D.v=2;P('Burger x6').c=Math.round(costoBurger()*600)/100}
let warn='',_s='';const promoOn=p=>p.pOn&&p.promo>0,precio=p=>promoOn(p)?p.promo:p.p;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>{e.style.display='none'},4000)}
const MED=['Efectivo','Mercado Pago','Banco','Otro'];
function caja(){const R={};MED.forEach(k=>R[k]={ini:D.caja0[k]||0,ing:0,egr:0});
 D.movs.forEach(m=>{const k=MED.includes(m.pago)?m.pago:'Efectivo';
  if(m.t=='venta'&&m.cobrado)R[k].ing+=m.p*m.q+m.env;else if(m.t=='visita'&&m.cobrado)R[k].ing+=m.pers*m.pp;else if(m.t=='cobro')R[k].ing+=m.monto;
  else if((m.t=='compra'||m.t=='gasto')&&m.pagado)R[k].egr+=m.monto;else if(m.t=='pago')R[k].egr+=m.monto});
 return R}
function cajaHtml(){const R=caja();let T=0;const c=MED.map(k=>{const x=R[k],t=x.ini+x.ing-x.egr;T+=t;return`<div class="k"><small>${k}</small><b class="${t<0?'al':''}">${$$$(t)}</b></div>`}).join('');
 return`<h2>💵 Caja: cuánto deberías tener</h2><div class="g">${c}</div><div class="r">Total en caja: <b>${$$$(T)}</b><br><small>Saldo inicial + cobrado − pagado, por medio de pago. No incluye lo que no cargaste (ej. pago a repartidores). El saldo inicial se carga en Config.</small></div>`}
const telDe=n=>(D.clientes.find(c=>c.n.toLowerCase()==(n||'').toLowerCase())||{}).tel||'';
function fillTel(k){const e=$('#'+k+'_tel'),nm=$('#'+k+'_cli').value,t=telDe(nm);if(e&&t)e.value=t;const c=D.clientes.find(x=>x.n.toLowerCase()==nm.toLowerCase());if(c&&c.precios&&Object.keys(c.precios).length)toast('Precios de '+c.n+': '+Object.entries(c.precios).map(([n,p])=>n+' '+$$$(p)).join(' · '))}
function addCli(){const n=$('#an').value.trim();if(!n)return toast('Poné el nombre');const c=D.clientes.find(x=>x.n.toLowerCase()==n.toLowerCase());if(c)c.tel=$('#at').value;else D.clientes.push({n,tel:$('#at').value});save();render();toast('✔ Cliente guardado')}
function addPrecio(i){const n=$('#ps'+i).value,v=parseFloat($('#pv'+i).value)||0;if(!v)return toast('Poné el precio');(D.clientes[i].precios=D.clientes[i].precios||{})[n]=v;save();render()}
function agenda(){return`<h2>Agenda de clientes</h2>${D.clientes.map((c,i)=>`<div class="r"><b>${c.n}</b>${c.tipo?' · '+c.tipo:''}<input type="tel" value="${c.tel||''}" placeholder="Celular" onchange="D.clientes[${i}].tel=this.value;save()">${Object.keys(c.precios||{}).map(n=>`<label>Precio: ${n}</label><input type="number" value="${c.precios[n]}" onchange="D.clientes[${i}].precios['${n}']=+this.value;save()">`).join('')}<div style="display:flex;gap:6px"><select id="ps${i}" style="width:auto">${D.prods.filter(p=>p.u!='Visitas'&&!p.combo).map(p=>`<option>${p.n}</option>`).join('')}</select><input id="pv${i}" type="number" placeholder="Precio especial"><button onclick="addPrecio(${i})">+</button></div></div>`).join('')||'<div class="r">Sin clientes</div>'}<div class="r"><input id="an" placeholder="Nombre"><input id="at" type="tel" placeholder="Celular"><button class="btn s" onclick="addCli()">+ Agregar cliente</button></div>`}
function sure(k,msg){if(_s==k)return true;_s=k;toast(msg+' Tocá de nuevo para confirmar.');setTimeout(()=>{if(_s==k)_s=''},5000);return false}
function expo(){const t=JSON.stringify(D),e=$('#bk');e.value=t;try{e.select();document.execCommand('copy');toast('Datos copiados. Pegalos en la otra pantalla.')}catch(x){toast('Copiá el texto de la caja')}}
function impo(){let d;try{d=JSON.parse($('#bk').value);if(!d.prods||!d.movs)throw 0}catch(x){return toast('El texto no es válido')}if(!sure('imp','Se reemplazan los datos de esta pantalla.'))return;D=d;save();location.reload()}
function addFijo(){const n=$('#fn').value.trim(),m=parseFloat($('#fm').value)||0;if(!n)return;D.fijos.push({n,u:$('#fu').value,m});save();render()}
let tab='Panel',ft='venta';
const TABS=['Panel','Cargar','Ventas','Gastos','Visitas','Repartos','Stock','Cuentas','Rentab.','Config'];
function calc(){
 const v=M('venta'),vi=M('visita');
 const ing=v.reduce((a,m)=>a+m.p*m.q,0)+vi.reduce((a,m)=>a+m.pers*m.pp,0);
 const cmv=v.reduce((a,m)=>a+cst(m),0);
 const env=v.reduce((a,m)=>a+m.env-m.envR,0);
 const kgM=kgCos(mes()),fijoGen=D.fijos.filter(x=>x.u!='Gírgolas').reduce((a,x)=>a+x.m,0),sinAbs=Math.max(0,fijoGir()-kgM*costoKgMes(mes())),gT=M('gasto').reduce((a,m)=>a+m.monto,0),fijo=fijoGen+sinAbs;
 const gan=ing-cmv+env-gT-fijo,mc=ing?(ing-cmv)/ing:0;
 const sd=saldos(),sum=o=>Object.values(o).filter(x=>x>0.5).reduce((a,x)=>a+x,0),cobrar=sum(sd.C),pagar=sum(sd.V);
 return{ing,cmv,gT,gan,mc,cobrar,pagar,fijo,fijoGen,sinAbs,envC:v.reduce((a,m)=>a+m.env,0),envK:v.reduce((a,m)=>a+m.envR,0),dto:[...M('venta'),...M('visita')].reduce((a,m)=>a+(m.dp||0)*(m.q||m.pers||0),0),pe:mc>0?(fijo+gT)/mc:0,env};}
function render(){recalc();
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('');
 $('#app').innerHTML=({Panel:pPanel,Cargar:pCargar,Repartos:pRep,Stock:pStock,'Rentab.':pRent,Config:pCfg,Visitas:pVis,Cuentas:pCuentas,Ventas:pVentas,Gastos:pGastos})[tab]();}
function pPanel(){const c=calc(),pr=M('prod'),al=[];
 D.prods.forEach(p=>{if(p.m&&!p.kg&&!p.un&&p.s<=p.m)al.push(`Stock bajo: ${p.n} (${p.s})`);if(precio(p)&&p.c&&precio(p)<p.c)al.push(`${p.n} se vende bajo su costo`);if(precio(p)&&p.c&&(precio(p)-p.c)/precio(p)*100<D.rec.margenMin)al.push(`Margen bajo en ${p.n}`)});
 D.movs.filter(m=>(m.t=='compra'||m.t=='gasto')&&!m.pagado&&m.venc&&m.venc<hoy()&&(saldos().V[key(m)]||0)>0.5).forEach(m=>al.push(`🔴 Vencido: ${m.det} ${$$$(m.monto)}`));Object.entries(saldos().C).filter(e=>e[1]>0.5).forEach(e=>al.push(`💰 ${e[0]} debe ${$$$(e[1])}`));

 <h2>Cómo se reparten los costos de gírgolas</h2><div class="r">Costos fijos de producción de gírgolas: <b>${$$$(fg)}</b><br>÷ ${kgM.toFixed(1)} kg aptos cosechados = <b>${$$$(ck)}/kg</b><br><small>Ese costo ya está dentro del costo de lo vendido (gírgolas y Burger). No se resta otra vez del mes.</small><br>Gírgolas usadas en Burger este mes: <b>${$$$(trans)}</b> <small>(transferencia interna, no es un gasto nuevo)</small></div><h2>Margen por producto (mes)</h2><div class="tb"><table><tr><th>Producto</th><th>Venta</th><th>Costo</th><th>Ganancia</th><th>Margen</th></tr>${rows}</table></div>

 <h2>Zonas de envío (cobro al cliente)</h2>${Object.keys(D.zonas).map(z=>`<label>${z}</label><input type="number" value="${D.zonas[z]}" onchange="D.zonas['${z}']=+this.value;save()">`).join('')}

 <label>Costo del kg de gírgola en la receta (0 = automático: costo por kg del mes)</label><input type="number" value="${r.girKg||0}" onchange="D.rec.girKg=+this.value;save()">
